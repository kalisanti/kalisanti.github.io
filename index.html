      else S.pos.push({id:uid(),tk:n.tk,isin:n.isin,nm:n.nm,q:n.q,pm:n.pm,pa:n.pa});
    });
    const c=news.length;IMP.rows=null;commit();render(false);toast(c+' posiciones importadas');
  };
}
function readImport(text){
  const p=parseCSV(text);
  if(p.rows.length<2){IMP.rows=null;const o=$('#im-out');if(o)o.innerHTML='<p class="note" style="color:var(--neg);margin-top:10px">No he podido leer filas. Comprueba que has incluido la primera fila con los nombres de las columnas.</p>';return}
  IMP.rows=p.rows;IMP.dc=p.delim!==',';IMP.map=guessMap(p.rows[0]);IMP.mode=IMP.mode||'merge';
  impOut();
}
function wImp(){
  const br=$('#im-br');if(!br)return;
  br.onchange=()=>{IMP.broker=br.value;$('#im-help').textContent=IMP_HELP[br.value]};
  $('#im-file').onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{$('#im-txt').value=String(r.result||'').slice(0,2e6);readImport($('#im-txt').value)};r.readAsText(f);
  };
  $('#im-read').onclick=()=>readImport($('#im-txt').value);
}

/* ===== Aprender: camino hacia la libertad financiera (contenido educativo) ===== */
const LESSONS={
es:[
{t:'Conoce tus números',s:'Qué entra, qué sale y qué parte conservas.',b:['Antes de invertir, hay que saber cuánto ganas, cuánto cuestan tus gastos esenciales y qué porcentaje de tus ingresos consigues guardar. Ese porcentaje es tu tasa de ahorro, y la ves en Inicio.','Al empezar, con una cartera pequeña, pesa mucho más lo que aportas que lo que esa cartera rinde. Por eso la tasa de ahorro es la palanca principal: puedes mejorarla tú, mientras que la rentabilidad del mercado no depende de ti.'],k:'Al empezar, tu tasa de ahorro importa más que la rentabilidad.'},
{t:'Págate primero',s:'Automatiza el ahorro el día que cobras.',b:['La forma más fiable de ahorrar es no tener que decidirlo cada mes: el día que cobras, mueve a ahorro e inversión la parte que has fijado y vive con el resto.','El reparto del Plan (esencial, inversión, colchón y ocio) sirve para eso: decides los porcentajes una vez y después solo compruebas que se cumplen. Lo que se decide una sola vez no depende de la fuerza de voluntad.'],k:'Lo que se decide una sola vez no depende de la fuerza de voluntad.'},
{t:'El fondo de emergencia',s:'Efectivo para imprevistos, antes de invertir.',b:['Es dinero en una cuenta accesible y de bajo riesgo para imprevistos: perder el empleo, una avería, una factura médica. Una regla habitual es cubrir de 3 a 6 meses de gastos esenciales; más si tus ingresos son variables o dependes de un solo sueldo.','Su función no es rentar, sino evitar que tengas que vender inversiones en un mal momento o endeudarte. Es la base sobre la que se construye todo lo demás.'],k:'El fondo de emergencia evita que un imprevisto te obligue a vender tus inversiones.'},
{t:'Las deudas caras primero',s:'Una deuda con intereses altos suele pesar más que cualquier rentabilidad esperada.',b:['Si pagas, por ejemplo, un 15 % o más en una tarjeta o en un préstamo al consumo, amortizarlo equivale a una rentabilidad segura de ese tamaño, algo que ninguna inversión puede prometer.','Una deuda con un interés bajo, como algunas hipotecas, es otro caso y depende de tu situación. Lo importante es comparar el coste real de cada deuda con lo que razonablemente cabe esperar de invertir, sin olvidar que esto último es incierto.'],k:'Pagar una deuda cara es una rentabilidad segura equivalente a su interés.'},
{t:'Por qué existe el colchón de inversión',s:'Liquidez dentro de tu plan para no vender cuando duele.',b:['El colchón de inversión es una reserva de efectivo que apartas dentro de tu plan, distinta del fondo de emergencia. Sirve para tres cosas: cubrir necesidades sin tocar las inversiones cuando el mercado cae, poder aportar algo más si ves caídas fuertes y, sobre todo, estar tranquilo para no vender por miedo.','No es una herramienta para adivinar el mercado: nadie sabe cuándo caerá ni cuándo subirá, y esperar a una bajada puede dejarte fuera mientras sube. Además, el efectivo pierde poder adquisitivo con la inflación, así que conviene que sea una parte limitada. Aquí es el bloque Colchón de tu Plan.'],k:'El colchón no sirve para predecir el mercado, sino para que nunca te veas obligado a vender mal.'},
{t:'Invierte con regularidad',s:'Aportar cada mes quita la presión de elegir el momento.',b:['Aportar una cantidad fija cada mes hace que compres más participaciones cuando el precio es bajo y menos cuando es alto, y te quita la decisión de “cuándo entrar”.','Si ya tuvieras todo el dinero de golpe, estadísticamente invertirlo cuanto antes suele dar mejor resultado medio, porque los mercados suben más veces de las que bajan, aunque sin garantías. Pero casi todos cobramos mes a mes, así que aportar con regularidad encaja con cómo llega el dinero, y es lo que mejor se mantiene en el tiempo.'],k:'La constancia gana a intentar acertar el momento de entrada.'},
{t:'La mentalidad del inversor en fondos indexados',s:'No intentas ganar al mercado: quieres ser dueño de él.',b:['Un fondo indexado compra todas las empresas de un índice, a menudo miles, con costes muy bajos. No intenta elegir ganadoras: acepta la rentabilidad del mercado a cambio de diversificación y precio.','Los estudios sobre fondos de gestión activa, como los informes SPIVA, muestran que a largo plazo la mayoría rinde menos que su índice de referencia una vez descontados los costes. Es una media, no una regla sin excepciones, pero explica por qué muchos inversores eligen lo simple.','La mentalidad es aburrida a propósito: no controlas la rentabilidad, pero sí los costes, la diversificación, cuánto ahorras y cómo te comportas. Céntrate en eso.'],k:'No controlas el mercado; controlas los costes, la diversificación, lo que ahorras y tu comportamiento.'},
{t:'Costes e impuestos',s:'Pequeñas comisiones se acumulan durante décadas.',b:['Los costes también se capitalizan. Con una rentabilidad bruta del 7 % anual, restar un 1 % de comisiones (6 % neto) puede reducir el capital final cerca de una cuarta parte tras 30 años. Compara siempre los gastos anuales de un producto antes de contratarlo.','Los impuestos dependen de cada país y cambian con el tiempo, y pueden influir mucho en el resultado neto. Infórmate de la fiscalidad de tu país o consulta a un profesional.','Ejemplo para España, a título orientativo (comprueba siempre la normativa vigente y tu caso): las ganancias de fondos, acciones y ETF, junto con los dividendos y los intereses, tributan en la base del ahorro del IRPF. En territorio común, los primeros 6.000 € tributan al 19 %, de 6.000 a 50.000 € al 21 % y de 50.000 a 200.000 € al 23 %, con tipos superiores por encima (Navarra y el País Vasco tienen escalas propias).','Solo se paga cuando se vende, porque es entonces cuando se materializa la ganancia. Si compras por 10.000 € y vendes por 12.000 €, la ganancia es de 2.000 € y, si no tienes otras rentas del ahorro, la cuota sería de 380 € (19 %). Al vender acciones o ETF se aplica el criterio FIFO (se venden primero las más antiguas), y los traspasos entre fondos de inversión permiten aplazar el impuesto hasta que reembolsas a tu cuenta; con los ETF esto no es posible.','Con un bróker extranjero lo habitual es que tengas que calcular y declarar tú mismo las ganancias y dividendos, y puede existir una declaración informativa de bienes en el extranjero (modelo 720) si superas ciertos importes. Con uno español suelen facilitarte datos fiscales, pero declarar sigue siendo tu responsabilidad. Consulta la Agencia Tributaria o a un asesor fiscal.'],k:'Un 1 % de coste anual puede restar cerca de una cuarta parte del capital final en 30 años.'},
{t:'Aguanta las caídas',s:'El comportamiento decide más que la estrategia.',b:['Los mercados caen con regularidad, y caídas del 30 % o más han ocurrido varias veces. Históricamente se han recuperado, pero eso no está garantizado ni dice cuánto tardará. Vender en lo más bajo convierte una pérdida temporal en definitiva.','Decide tu plan con calma, antes de que llegue la tormenta: qué porcentaje de riesgo asumes, cuánto aportas y qué harás si cae. Mirar la cartera cada día no ayuda; revisarla una o dos veces al año basta.'],k:'Las caídas son parte del viaje: tu plan debe estar decidido antes de que lleguen.'},
{t:'El tiempo y el interés compuesto',s:'Empezar pronto pesa más que acertar.',b:['El interés compuesto significa que las ganancias generan nuevas ganancias. Como ejemplo hipotético, aportar 300 € al mes durante 30 años con un 7 % anual constante daría unos 366.000 €, de los que solo 108.000 € serían aportaciones. Es una hipótesis, no una promesa: la rentabilidad real varía cada año.','Cada año que retrasas el comienzo reduce ese efecto. Prueba tus propias cifras en Crecer.'],k:'Cada año de retraso le quita fuerza al interés compuesto.'},
{t:'Tu número de libertad financiera',s:'Cuánto necesitas para que tu cartera cubra tus gastos.',b:['Una guía muy conocida es multiplicar tus gastos anuales por 25, lo que equivale a retirar cada año alrededor del 4 % de la cartera. Con 1.500 € de gasto mensual serían 18.000 € al año y una cifra cercana a 450.000 €.','Esa regla procede de estudios con datos históricos de EE. UU. y es solo una orientación: no garantiza nada, y para periodos muy largos muchos prefieren porcentajes más prudentes. Puedes poner tu cifra como objetivo en Crecer.'],k:'Gastos anuales × 25 es un punto de partida, no una garantía.'},
{t:'Revisa una vez al año',s:'Mantén el rumbo sin obsesionarte.',b:['Una vez al año, repasa tu Plan: actualiza ingresos, comprueba que los porcentajes siguen teniendo sentido y sube tus aportaciones cuando suban tus ingresos (el simulador de Crecer permite una subida anual).','Si tu reparto entre activos se ha desviado mucho de lo que querías, puedes reequilibrarlo. En España, vender acciones o ETF para ello puede generar una ganancia tributable, mientras que con fondos de inversión los traspasos permiten reequilibrar sin tributar en ese momento; también puedes reequilibrar dirigiendo tus nuevas aportaciones a lo que pesa menos. Todo lo demás es ruido: la libertad financiera es un camino de décadas, no de meses.'],k:'Revisar una vez al año basta; la constancia hace el resto.'}
],
en:[
{t:'Know your numbers',s:'What comes in, what goes out and how much you keep.',b:['Before investing, you need to know how much you earn, how much your essential costs are and what percentage of your income you manage to keep. That percentage is your savings rate, and you can see it on Home.','When you start with a small portfolio, what you contribute matters far more than what the portfolio earns. That is why the savings rate is the main lever: you can improve it yourself, whereas market returns are out of your hands.'],k:'When you start, your savings rate matters more than returns.'},
{t:'Pay yourself first',s:'Automate saving on the day you get paid.',b:['The most reliable way to save is not having to decide every month: on payday, move the amount you set to savings and investing and live on the rest.','The split in the Plan (essentials, investing, buffer and leisure) is for this: you choose the percentages once and then just check they\'re being met. What you decide once doesn\'t depend on willpower.'],k:'What you decide once doesn\'t depend on willpower.'},
{t:'The emergency fund',s:'Cash for the unexpected, before you invest.',b:['It\'s money in an accessible, low-risk account for surprises: losing your job, a breakdown, a medical bill. A common rule is to cover 3 to 6 months of essential expenses, more if your income is irregular or you rely on a single salary.','Its job isn\'t to earn a return but to stop you having to sell investments at a bad moment or take on debt. Everything else is built on top of it.'],k:'An emergency fund stops a surprise from forcing you to sell your investments.'},
{t:'Expensive debt first',s:'High-interest debt usually outweighs any expected return.',b:['If you pay, say, 15% or more on a card or consumer loan, paying it off is the same as a guaranteed return of that size, something no investment can promise.','Low-interest debt, such as some mortgages, is a different case and depends on your situation. What matters is comparing the real cost of each debt with what you can reasonably expect from investing, remembering that the latter is uncertain.'],k:'Paying off expensive debt is a guaranteed return equal to its interest rate.'},
{t:'Why the investment buffer exists',s:'Liquidity inside your plan so you don\'t sell when it hurts.',b:['The investment buffer is a cash reserve you set aside within your plan, separate from the emergency fund. It does three things: covers needs without touching investments when the market falls, lets you add a bit more if you see sharp drops and, above all, keeps you calm so you don\'t sell out of fear.','It isn\'t a tool for guessing the market: nobody knows when it will fall or rise, and waiting for a dip can leave you out while prices climb. Also, cash loses purchasing power to inflation, so it\'s best kept to a limited share. Here it is the Buffer block of your Plan.'],k:'The buffer isn\'t for predicting the market; it\'s so you are never forced to sell at a bad time.'},
{t:'Invest regularly',s:'Contributing every month removes the pressure of picking the moment.',b:['Contributing a fixed amount each month means you buy more shares when prices are low and fewer when they are high, and it takes away the decision of "when to get in".','If you already had all the money at once, statistically investing it sooner tends to give a better average result, because markets rise more often than they fall, though with no guarantees. But most of us are paid monthly, so contributing regularly fits how money arrives, and it\'s what is easiest to keep up over time.'],k:'Consistency beats trying to time your entry.'},
{t:'The index fund investor mindset',s:'You\'re not trying to beat the market: you want to own it.',b:['An index fund buys all the companies in an index, often thousands, at very low cost. It doesn\'t try to pick winners: it accepts the market\'s return in exchange for diversification and a low price.','Studies of actively managed funds, such as the SPIVA reports, show that over the long run most underperform their benchmark once costs are deducted. That\'s an average, not a rule without exceptions, but it explains why many investors choose the simple route.','The mindset is boring on purpose: you can\'t control returns, but you can control costs, diversification, how much you save and how you behave. Focus on those.'],k:'You can\'t control the market; you control costs, diversification, what you save and your behaviour.'},
{t:'Costs and taxes',s:'Small fees add up over decades.',b:['Costs compound too. With a 7% gross annual return, subtracting 1% in fees (6% net) can cut the final capital by about a quarter after 30 years. Always compare a product\'s annual costs before buying it.','Taxes depend on each country and change over time, and they can affect the net result a lot. Find out about the tax rules in your country or ask a professional.','An example for Spain, for guidance only (always check the current rules and your own case): gains from funds, shares and ETFs, plus dividends and interest, are taxed in the IRPF savings base. In mainland Spain, the first €6,000 is taxed at 19%, from €6,000 to €50,000 at 21% and from €50,000 to €200,000 at 23%, with higher rates above that (Navarre and the Basque Country have their own scales).','You only pay when you sell, because that is when the gain is realised. If you buy for €10,000 and sell for €12,000, the gain is €2,000 and, if you have no other savings income, the tax would be €380 (19%). When selling shares or ETFs the FIFO rule applies (the oldest are sold first), and transfers between investment funds let you defer the tax until you redeem into your account; this isn\'t possible with ETFs.','With a foreign broker you usually have to calculate and declare gains and dividends yourself, and there may be a reporting obligation for assets abroad (form 720) if you exceed certain amounts. With a Spanish one you are usually given tax data, but declaring remains your responsibility. Check with the Spanish Tax Agency or a tax adviser.'],k:'A 1% annual cost can take about a quarter off the final capital over 30 years.'},
{t:'Sit through the drops',s:'Behaviour matters more than strategy.',b:['Markets fall regularly, and drops of 30% or more have happened several times. They have historically recovered, but that isn\'t guaranteed and says nothing about how long it takes. Selling at the bottom turns a temporary loss into a permanent one.','Decide your plan calmly, before the storm arrives: how much risk you take, how much you contribute and what you\'ll do if it falls. Checking your portfolio every day doesn\'t help; reviewing it once or twice a year is enough.'],k:'Drops are part of the journey: decide your plan before they arrive.'},
{t:'Time and compound interest',s:'Starting early matters more than getting it right.',b:['Compound interest means earnings generate further earnings. As a hypothetical example, contributing €300 a month for 30 years at a constant 7% a year would give about €366,000, of which only €108,000 would be contributions. It\'s a hypothesis, not a promise: real returns vary every year.','Every year you delay starting weakens that effect. Try your own numbers in Grow.'],k:'Every year of delay takes strength away from compound interest.'},
{t:'Your financial freedom number',s:'How much you need for your portfolio to cover your spending.',b:['A well-known guideline is to multiply your annual expenses by 25, which equals withdrawing around 4% of the portfolio each year. With €1,500 of monthly spending that would be €18,000 a year and a figure close to €450,000.','That rule comes from studies of US historical data and is only a guide: it guarantees nothing, and for very long periods many prefer more cautious percentages. You can set your figure as a goal in Grow.'],k:'Annual expenses × 25 is a starting point, not a guarantee.'},
{t:'Review once a year',s:'Stay on course without obsessing.',b:['Once a year, go over your Plan: update your income, check the percentages still make sense and raise your contributions when your income rises (the Grow simulator allows an annual increase).','If your split between assets has drifted a lot from what you wanted, you can rebalance. In Spain, selling shares or ETFs to do so can create a taxable gain, while with investment funds transfers let you rebalance without paying tax at that moment; you can also rebalance by directing new contributions to whatever weighs less. Everything else is noise: financial freedom is a path of decades, not months.'],k:'Reviewing once a year is enough; consistency does the rest.'}
],
ca:[
{t:'Coneix els teus números',s:'Què entra, què surt i quina part en conserves.',b:['Abans d\'invertir cal saber quant guanyes, quant costen les teves despeses essencials i quin percentatge dels teus ingressos aconsegueixes guardar. Aquest percentatge és la teva taxa d\'estalvi, i la veus a Inici.','Quan comences, amb una cartera petita, pesa molt més el que hi aportes que el que aquesta cartera rendeix. Per això la taxa d\'estalvi és la palanca principal: la pots millorar tu, mentre que la rendibilitat del mercat no depèn de tu.'],k:'Quan comences, la teva taxa d\'estalvi importa més que la rendibilitat.'},
{t:'Paga\'t primer a tu',s:'Automatitza l\'estalvi el dia que cobres.',b:['La manera més fiable d\'estalviar és no haver-ho de decidir cada mes: el dia que cobres, mou a estalvi i inversió la part que has fixat i viu amb la resta.','El repartiment del Pla (essencial, inversió, coixí i lleure) serveix per a això: decideixes els percentatges una vegada i després només comproves que es compleixen. El que es decideix una sola vegada no depèn de la força de voluntat.'],k:'El que es decideix una sola vegada no depèn de la força de voluntat.'},
{t:'El fons d\'emergència',s:'Efectiu per als imprevistos, abans d\'invertir.',b:['És diner en un compte accessible i de baix risc per a imprevistos: perdre la feina, una avaria, una factura mèdica. Una regla habitual és cobrir de 3 a 6 mesos de despeses essencials; més si els teus ingressos són variables o depens d\'un sol sou.','La seva funció no és rendir, sinó evitar que hagis de vendre inversions en un mal moment o endeutar-te. És la base sobre la qual es construeix tota la resta.'],k:'El fons d\'emergència evita que un imprevist t\'obligui a vendre les teves inversions.'},
{t:'Primer, els deutes cars',s:'Un deute amb interessos alts sol pesar més que qualsevol rendibilitat esperada.',b:['Si pagues, per exemple, un 15 % o més en una targeta o en un préstec al consum, amortitzar-lo equival a una rendibilitat segura d\'aquesta mida, cosa que cap inversió no pot prometre.','Un deute amb un interès baix, com algunes hipoteques, és un altre cas i depèn de la teva situació. El que importa és comparar el cost real de cada deute amb el que raonablement es pot esperar d\'invertir, sense oblidar que això últim és incert.'],k:'Pagar un deute car és una rendibilitat segura equivalent al seu interès.'},
{t:'Per què existeix el coixí d\'inversió',s:'Liquiditat dins del teu pla per no vendre quan fa mal.',b:['El coixí d\'inversió és una reserva d\'efectiu que reserves dins del teu pla, diferent del fons d\'emergència. Serveix per a tres coses: cobrir necessitats sense tocar les inversions quan el mercat cau, poder aportar una mica més si veus caigudes fortes i, sobretot, estar tranquil per no vendre per por.','No és una eina per endevinar el mercat: ningú no sap quan caurà ni quan pujarà, i esperar una baixada et pot deixar fora mentre puja. A més, l\'efectiu perd poder adquisitiu amb la inflació, així que convé que sigui una part limitada. Aquí és el bloc Coixí del teu Pla.'],k:'El coixí no serveix per predir el mercat, sinó perquè mai et vegis obligat a vendre malament.'},
{t:'Inverteix amb regularitat',s:'Aportar cada mes treu la pressió d\'escollir el moment.',b:['Aportar una quantitat fixa cada mes fa que compris més participacions quan el preu és baix i menys quan és alt, i et treu la decisió de «quan entrar».','Si ja tinguessis tot el diner d\'un cop, estadísticament invertir-lo com abans millor sol donar millor resultat mitjà, perquè els mercats pugen més vegades de les que baixen, tot i que sense garanties. Però gairebé tots cobrem mes a mes, així que aportar amb regularitat encaixa amb com arriba el diner, i és el que millor es manté en el temps.'],k:'La constància guanya a intentar encertar el moment d\'entrada.'},
{t:'La mentalitat de l\'inversor en fons indexats',s:'No intentes guanyar el mercat: vols ser-ne propietari.',b:['Un fons indexat compra totes les empreses d\'un índex, sovint milers, amb costos molt baixos. No intenta triar guanyadores: accepta la rendibilitat del mercat a canvi de diversificació i preu.','Els estudis sobre fons de gestió activa, com els informes SPIVA, mostren que a llarg termini la majoria rendeix menys que el seu índex de referència un cop descomptats els costos. És una mitjana, no una regla sense excepcions, però explica per què molts inversors trien el camí simple.','La mentalitat és avorrida a propòsit: no controles la rendibilitat, però sí els costos, la diversificació, quant estalvies i com et comportes. Centra\'t en això.'],k:'No controles el mercat; controles els costos, la diversificació, el que estalvies i el teu comportament.'},
{t:'Costos i impostos',s:'Petites comissions s\'acumulen durant dècades.',b:['Els costos també es capitalitzen. Amb una rendibilitat bruta del 7 % anual, restar-hi un 1 % de comissions (6 % net) pot reduir el capital final prop d\'una quarta part al cap de 30 anys. Compara sempre les despeses anuals d\'un producte abans de contractar-lo.','Els impostos depenen de cada país i canvien amb el temps, i poden influir molt en el resultat net. Informa\'t de la fiscalitat del teu país o consulta un professional.','Un exemple per a Espanya, a títol orientatiu (comprova sempre la normativa vigent i el teu cas): els guanys de fons, accions i ETF, juntament amb els dividends i els interessos, tributen a la base de l\'estalvi de l\'IRPF. A territori comú, els primers 6.000 € tributen al 19 %, de 6.000 a 50.000 € al 21 % i de 50.000 a 200.000 € al 23 %, amb tipus superiors per sobre (Navarra i el País Basc tenen escales pròpies).','Només es paga quan es ven, perquè és llavors quan es materialitza el guany. Si compres per 10.000 € i vens per 12.000 €, el guany és de 2.000 € i, si no tens altres rendes de l\'estalvi, la quota seria de 380 € (19 %). En vendre accions o ETF s\'aplica el criteri FIFO (es venen primer les més antigues), i els traspassos entre fons d\'inversió permeten ajornar l\'impost fins que reemborses al teu compte; amb els ETF això no és possible.','Amb un bròquer estranger el normal és que hagis de calcular i declarar tu mateix els guanys i dividends, i pot existir una declaració informativa de béns a l\'estranger (model 720) si superes certs imports. Amb un d\'espanyol solen facilitar-te dades fiscals, però declarar continua sent responsabilitat teva. Consulta l\'Agència Tributària o un assessor fiscal.'],k:'Un 1 % de cost anual pot restar prop d\'una quarta part del capital final en 30 anys.'},
{t:'Aguanta les caigudes',s:'El comportament decideix més que l\'estratègia.',b:['Els mercats cauen amb regularitat, i caigudes del 30 % o més han passat diverses vegades. Històricament s\'han recuperat, però això no està garantit ni diu quant trigarà. Vendre al punt més baix converteix una pèrdua temporal en definitiva.','Decideix el teu pla amb calma, abans que arribi la tempesta: quin percentatge de risc assumeixes, quant aportes i què faràs si cau. Mirar la cartera cada dia no ajuda; revisar-la una o dues vegades a l\'any n\'hi ha prou.'],k:'Les caigudes formen part del viatge: el teu pla ha d\'estar decidit abans que arribin.'},
{t:'El temps i l\'interès compost',s:'Començar aviat pesa més que encertar.',b:['L\'interès compost vol dir que els guanys generen nous guanys. Com a exemple hipotètic, aportar 300 € al mes durant 30 anys amb un 7 % anual constant donaria uns 366.000 €, dels quals només 108.000 € serien aportacions. És una hipòtesi, no una promesa: la rendibilitat real varia cada any.','Cada any que endarrereixes el començament redueix aquest efecte. Prova les teves xifres a Créixer.'],k:'Cada any de retard treu força a l\'interès compost.'},
{t:'El teu número de llibertat financera',s:'Quant necessites perquè la cartera cobreixi les teves despeses.',b:['Una guia molt coneguda és multiplicar les teves despeses anuals per 25, cosa que equival a retirar cada any al voltant del 4 % de la cartera. Amb 1.500 € de despesa mensual serien 18.000 € a l\'any i una xifra propera als 450.000 €.','Aquesta regla prové d\'estudis amb dades històriques dels EUA i és només una orientació: no garanteix res, i per a períodes molt llargs molts prefereixen percentatges més prudents. Pots posar la teva xifra com a objectiu a Créixer.'],k:'Despeses anuals × 25 és un punt de partida, no una garantia.'},
{t:'Revisa una vegada a l\'any',s:'Mantén el rumb sense obsessionar-te.',b:['Una vegada a l\'any, repassa el teu Pla: actualitza ingressos, comprova que els percentatges encara tenen sentit i puja les teves aportacions quan pugin els teus ingressos (el simulador de Créixer permet una pujada anual).','Si el teu repartiment entre actius s\'ha desviat molt del que volies, el pots reequilibrar. A Espanya, vendre accions o ETF per fer-ho pot generar un guany tributable, mentre que amb fons d\'inversió els traspassos permeten reequilibrar sense tributar en aquell moment; també pots reequilibrar adreçant les noves aportacions al que pesa menys. Tota la resta és soroll: la llibertat financera és un camí de dècades, no de mesos.'],k:'Revisar una vegada a l\'any n\'hi ha prou; la constància fa la resta.'}

  '<p class="note legal" data-notr>'+esc(u.legal.replace('APP',APP))+'</p>';

function wLearn(){

  if(location.hash!=='#nuevo')return;
  try{history.replaceState(null,'','#movimientos')}catch(e){}
  UI.mvF='m';UI.mvQ='';UI.cur=CM;render(false);window.scrollTo(0,0);addRow();
}

/* paleta */
const PALS=[['','Naranja','#FF9600'],['ocean','Océano','#1CB0F6'],['forest','Bosque','#4CB800'],['violet','Violeta','#7C4DFF'],['berry','Fresa','#F2569B'],['graphite','Grafito','#3A3F4B']];
let PAL='';
try{const p=localStorage.getItem('brote-pal');if(PALS.some(x=>x[0]===p))PAL=p}catch(e){}
function setPal(p){
  PAL=p;
  if(p)document.documentElement.setAttribute('data-pal',p);else document.documentElement.removeAttribute('data-pal');
  try{localStorage.setItem('brote-pal',p)}catch(e){}
}
if(PAL)document.documentElement.setAttribute('data-pal',PAL);
/* tema */
const KT='brote-tema',root=document.documentElement;
try{const t=localStorage.getItem(KT);if(t==='light'||t==='dark')root.setAttribute('data-theme',t)}catch(e){}
function toggleTheme(){
  const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark';
  root.setAttribute('data-theme',next);
  try{localStorage.setItem(KT,next)}catch(e){}
}
const themeBtn='<button class="icon js-theme" type="button" aria-label="Cambiar entre modo noche y modo claro" title="Modo noche / claro"><svg class="ic moon" viewBox="0 0 24 24">'+IC.moon+'</svg><svg class="ic sun" viewBox="0 0 24 24">'+IC.sun+'</svg></button>';
const bookBtn='<button class="icon js-go" data-go="aprender" type="button" aria-label="Aprender" title="Aprender">'+ico('book')+'</button>';
const gearBtn='<button class="icon js-go" data-go="ajustes" type="button" aria-label="Ajustes" title="Ajustes">'+ico('gear')+'</button>';
const pill='<div class="pill js-status" role="status"><i></i><span></span></div>';

function buildShell(){
  $('#side').innerHTML='<a class="brand" href="#inicio" aria-label="Sprigwise, inicio">'+logo()+'<b>Sprigwise</b></a><nav aria-label="Secciones">'+
    NAV.slice(0,6).map(n=>'<button type="button" data-go="'+n[0]+'">'+ico(n[2])+'<span>'+n[1]+'</span></button>').join('')+'</nav><div class="grow"></div>'+
    '<div class="foot">'+pill+'<div style="display:flex;gap:8px">'+themeBtn+gearBtn+'</div></div>';
  $('#topbar').innerHTML='<a class="brand" href="#inicio" aria-label="Sprigwise, inicio">'+logo()+'<b>Sprigwise</b></a><div class="tools">'+pill+themeBtn+bookBtn+gearBtn+'</div>';
  $('#tabbar').innerHTML=NAV.slice(0,5).map(n=>'<button type="button" data-go="'+n[0]+'">'+ico(n[2])+'<span>'+n[1]+'</span></button>').join('');
  $$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$('.js-theme').forEach(b=>b.onclick=toggleTheme);
  updateStatus();
}
function markNav(){
  $$('[data-go]').forEach(b=>{if(b.dataset.go===VIEW)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
}
const PILL_TXT={local:'Solo en este dispositivo',connecting:'Conectando…',saving:'Guardando…',sync:'Sincronizado',offline:'Sin conexión',error:'Error al sincronizar'};
function updateStatus(){
  $$('.js-status').forEach(p=>{
    p.className='pill '+SYNC+' js-status';
    const sp=p.querySelector('span');if(sp)sp.textContent=PILL_TXT[SYNC]||'';p.title=PILL_TXT[SYNC]||'';
  });
}
async function saveFile(name,text,mime){
  try{
    if(window.claude&&window.claude.use){
      const d=await window.claude.use('downloads');
      if(d){await d.save({filename:name,data:text});return}
    }
  }catch(e){if(e&&e.code==='declined')return}
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast('No se pudo descargar el archivo')}
}
let toastT=null;
function toast(msg){
  const t=$('#toast');
  t.textContent=msg;t.hidden=false;
  t.style.animation='none';void t.offsetWidth;t.style.animation='';
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2400);
}
function go(name){
  if(location.hash==='#'+name){VIEW=name;render(true);window.scrollTo(0,0);return}
  location.hash=name;
}
function render(anim){
  const n=NAV.find(x=>x[0]===VIEW)||NAV[0],rootEl=$('#view');
  rootEl.className='view'+(anim?' enter':'');
  UI.anim=!!anim;
  rootEl.innerHTML=n[3]();
  if(n[4])n[4]();
  $$('#view [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  UI.anim=false;
  markNav();
  if(anim){FX.countUp(rootEl);clearTimeout(render.t);render.t=setTimeout(()=>rootEl.classList.remove('enter'),1300)}
}
window.addEventListener('hashchange',()=>{const q=location.hash==='#nuevo';VIEW=hashName();if(q){quickNew();return}render(true);window.scrollTo(0,0)});

onStatus=()=>{updateStatus();if(VIEW==='ajustes'&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))render(false)};
onRemoteApply=()=>{const t=(document.activeElement||{}).tagName||'';if(!/INPUT|SELECT|TEXTAREA/.test(t))render(false)};

function setLang(l){
  if(!LOCS[l])return;
  LANG=l;_dre=null;
  try{localStorage.setItem('brote-lang',l)}catch(e){}
  applyLang();buildShell();render(false);
  if(LANG!=='es')trNode(document.body);
}
applyLang();
buildShell();
if(LOGO_I)setLogo(LOGO_I);
VIEW=hashName();
render(true);
initCloud();
quickNew();
if(LANG!=='es')trNode(document.body);

if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
